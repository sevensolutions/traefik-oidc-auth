name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.22.0 or v0.22.0"
        required: true
        type: string
      target:
        description: "Branch, tag or commit SHA to create the release from"
        required: false
        default: main
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}

      - name: Normalize and validate version
        id: version
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${{ inputs.version }}' is not a valid version (expected X.Y.Z or vX.Y.Z)"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Generate SBOM
        id: sbom
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0

          file="sbom-${{ steps.version.outputs.tag }}.cdx.json"
          # The plugin is Yaegi-interpreted, never compiled, so this is generated
          # from the go.mod/go.sum module graph rather than from a built binary.
          cyclonedx-gomod mod -licenses -json -output "$file" ./src

          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.sbom.outputs.file }}" \
            --target "${{ inputs.target }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --draft \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
